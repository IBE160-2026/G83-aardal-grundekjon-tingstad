# Runs the same checks as the README on every pull request and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, format and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  e2e:
    name: Playwright against the production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    name: docker compose up, as the examiner runs it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --build --wait app
      - name: Wait for the app on port 3000
        run: |
          docker compose ps -a
          for i in $(seq 1 30); do curl -fs http://localhost:3000 > /dev/null && exit 0; sleep 2; done
          exit 1
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
